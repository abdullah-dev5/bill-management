openapi: 3.0.3
info:
  title: Bill Management API
  version: 0.1.0
  description: |
    REST API for the Bill Management PWA.
    Money is always integer minor units (paisa) in fields ending in `Minor`.
    Dates are ISO `YYYY-MM-DD`; billing months are `YYYY-MM`.
    Authentication uses an HTTP-only session cookie. Every state-changing request
    must also send the `X-CSRF-Token` header matching the `bm_csrf` cookie.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: household
  - name: types
  - name: providers
  - name: profiles
  - name: bills
  - name: payments
  - name: documents
  - name: home
  - name: analytics

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Signed out }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      responses:
        '204': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Current user and household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: If the email exists, a reset link was sent }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/ValidationError' }

  /account:
    delete:
      tags: [auth]
      operationId: requestAccountDeletion
      description: Schedules deletion in 14 days and signs out everywhere. Signing in again cancels it.
      responses:
        '204': { description: Deletion scheduled }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /household:
    get:
      tags: [household]
      operationId: getHousehold
      responses:
        '200':
          description: Household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
    put:
      tags: [household]
      operationId: updateHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /home:
    get:
      tags: [home]
      operationId: getHome
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Home dashboard summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSummary' }

  /search:
    get:
      tags: [search]
      operationId: search
      description: Global search (FR-SRCH-01/02). Phrases like "electricity september 2025" become filters; other words are matched as text.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Matching profiles, bills and documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

  /activity:
    get:
      tags: [home]
      operationId: listActivity
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Recent activity, newest first (FR-DASH-05)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityItem' }

  /export/bills.csv:
    get:
      tags: [export]
      operationId: exportBillsCsv
      description: Bills as CSV (FR-EXP-01), by bill date; amounts in rupees.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /export/payments.csv:
    get:
      tags: [export]
      operationId: exportPaymentsCsv
      description: Payments as CSV (FR-EXP-01), by payment date.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /export/backup.zip:
    get:
      tags: [export]
      operationId: exportBackup
      description: Full backup (FR-EXP-02) — JSON data and every document. Owner only; includes reference numbers.
      responses:
        '200':
          description: ZIP file
          content:
            application/zip:
              schema: { type: string, format: binary }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Your reminders, newest first (FR-REM-01/04)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid }, maxItems: 200 }
                all: { type: boolean }
      responses:
        '204': { description: Marked as read }

  /notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      responses:
        '200':
          description: Your reminder settings for this household (FR-REM-02)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }

  /push/key:
    get:
      tags: [notifications]
      operationId: getPushKey
      description: The VAPID public key browsers subscribe with (FR-REM-03).
      responses:
        '200':
          description: Public key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushKey' }

  /push/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '204': { description: This device will receive push notifications }

  /push/unsubscribe:
    post:
      tags: [notifications]
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, maxLength: 2000 }
      responses:
        '204': { description: Removed }

  /push/test:
    post:
      tags: [notifications]
      operationId: testPush
      responses:
        '200':
          description: How many of your devices got the test notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushTestResult' }

  /bills/{id}/conflicts/{conflictId}/resolve:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: conflictId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [bills]
      operationId: resolveConflict
      description: Settles a field conflict (FR-RECO-05). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConflictResolution' }
      responses:
        '200':
          description: The bill after resolving
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bills/{id}/sources/{sourceId}/separate:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [bills]
      operationId: separateSource
      description: |
        Undoes a merge within 30 days (FR-RECO-07): fields the source filled are emptied again,
        its conflicts removed, and its document detached so it can be saved as its own bill.
      responses:
        '200':
          description: Separated
          content:
            application/json:
              schema:
                type: object
                required: [bill]
                properties:
                  bill: { $ref: '#/components/schemas/BillDetail' }
                  documentId: { type: string, format: uuid, nullable: true, description: The detached document, to save as a separate bill }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /profiles/{id}/retrieve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [profiles]
      operationId: retrieveProfileBill
      description: Fetch now (FR-RETR-06), for profiles with an automatic connector; throttled.
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrievalResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /profiles/{id}/retrieval:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [profiles]
      operationId: setProfileRetrieval
      description: Turn automatic checks of the official site on or off (FR-RETR-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /retrieval/connectors:
    get:
      tags: [profiles]
      operationId: listConnectors
      description: Automatic connectors and their health (FR-RETR-05).
      responses:
        '200':
          description: Connectors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorStatus' }

  /types:
    get:
      tags: [types]
      operationId: listTypes
      responses:
        '200':
          description: System and custom bill types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BillType' }
    post:
      tags: [types]
      operationId: createType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillTypeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillType' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /types/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [types]
      operationId: updateType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillTypeInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillType' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /types/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [types]
      operationId: archiveType
      responses:
        '204': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      parameters:
        - name: typeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Provider catalogue plus custom providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Provider' }
    post:
      tags: [providers]
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Bill profiles with summaries, in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profile' }
    post:
      tags: [profiles]
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/order:
    put:
      tags: [profiles]
      operationId: reorderProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileOrder' }
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/ValidationError' }
  /profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [profiles]
      operationId: getProfile
      responses:
        '200':
          description: Profile with summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [profiles]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [profiles]
      operationId: archiveProfile
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [profiles]
      operationId: restoreProfile
      responses:
        '204': { description: Restored }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bills:
    get:
      tags: [bills]
      operationId: listBills
      parameters:
        - name: profileId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: Repeat for several statuses (status=unpaid&status=overdue)
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/BillStatus' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: typeId
          in: query
          required: false
          description: Bill types (repeatable); a type includes its sub-categories
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: providerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: minAmount
          in: query
          required: false
          description: Minimum payable amount, minor units
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxAmount
          in: query
          required: false
          description: Maximum payable amount, minor units
          schema: { type: integer, format: int64, minimum: 0 }
        - name: needsReview
          in: query
          required: false
          description: Only bills with open conflicts
          schema: { type: boolean }
        - name: source
          in: query
          required: false
          description: How the bill arrived (repeatable)
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/BillSource' }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bills, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [bills]
      operationId: createBill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/DuplicateBill' }
  /bills/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [bills]
      operationId: getBill
      responses:
        '200':
          description: Bill with payments and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [bills]
      operationId: updateBill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DuplicateBill' }
    delete:
      tags: [bills]
      operationId: deleteBill
      description: Permanently deletes a bill. Only archived bills can be deleted.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bills/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [bills]
      operationId: archiveBill
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /bills/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [bills]
      operationId: restoreBill
      responses:
        '204': { description: Restored }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DuplicateBill' }
  /bills/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [payments]
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Payment recorded; returns the updated bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [payments]
      operationId: deletePayment
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics:
    get:
      tags: [analytics]
      operationId: getAnalytics
      description: |
        Spending (or cash paid) month by month over a range, broken down by group, type, provider and
        profile, with the previous period and the same period last year for comparison (FR-ANLT-02…06).
        Spending is current charges + adjustments + late fees paid, never arrears.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: to
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: basis
          in: query
          required: false
          description: "spend (default): bill spending by billing month. cash: payments by the month they were made."
          schema: { type: string, enum: [spend, cash] }
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      description: Ready documents of a bill, or documents not attached to any bill yet.
      parameters:
        - name: billId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: unattached
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [documents]
      operationId: createDocument
      description: |
        Starts an upload. Returns where to PUT the file; call `complete` afterwards.
        If the household already has this exact file (same SHA-256), the existing
        document is returned with `duplicate: true` and no upload is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadInput' }
      responses:
        '200':
          description: Same file already stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUpload' }
        '201':
          description: Upload started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUpload' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [documents]
      operationId: getDocument
      description: Includes fresh signed links (valid for 5 minutes).
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [documents]
      operationId: updateDocument
      description: Attach to a bill, detach (billId null) or change the kind.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      operationId: deleteDocument
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/extraction:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [documents]
      operationId: getExtraction
      description: The latest extraction of this document.
      responses:
        '200':
          description: Extraction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extraction' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documents]
      operationId: startExtraction
      description: |
        Reads the document in the background (docs/05). Poll GET until the status is
        `succeeded` or `failed`. If a run is already queued or running it is returned.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extraction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/extraction/device:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [documents]
      operationId: extractFromDeviceText
      description: |
        Tier 3 (docs/05): text the phone read itself (Tesseract.js) goes through the same
        parsers and validation as OCR text. No outside reading service sees the document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 50000 }
                confidence: { type: number, format: double, minimum: 0, maximum: 100, description: The on-device OCR's mean confidence }
      responses:
        '200':
          description: The finished extraction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extraction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/bill:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [documents]
      operationId: saveScannedBill
      description: |
        Saves a checked (verified) bill from a scanned or uploaded document and attaches the document
        (FR-EXTR-08, FR-RECO-01…03). If the profile already has this bill (same billing month or bill
        number) the response is 409 `duplicate_bill`; a bill that looks the same gives 409
        `probable_duplicate`. Repeat the request with `duplicate` set to attach the document to that
        bill, or (for probable duplicates) to keep the new bill separate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScannedBillInput' }
      responses:
        '200':
          description: Document attached to the existing bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '201':
          description: Bill created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DuplicateBill' }
  /profiles/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [profiles]
      operationId: listProfilePayments
      description: Payments made towards the profile's bills, newest first.
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfilePayment' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [profiles]
      operationId: listProfileDocuments
      description: Documents attached to the profile's bills, newest first (with fresh signed links).
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [profiles]
      operationId: getProfileHistory
      description: Month by month, from the profile's bills and from history printed on its bills.
      responses:
        '200':
          description: Months, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryMonth' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [documents]
      operationId: completeDocument
      description: Verifies the uploaded file (type, size, SHA-256) and makes it available.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bm_session

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in or wrong credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Your role does not allow this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with existing data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DuplicateBill:
      description: A bill for this profile and billing month already exists (`existingBillId` is set)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Field name → problem, for validation errors
        existingBillId:
          type: string
          format: uuid

    Role:
      type: string
      enum: [owner, editor, viewer]

    User:
      type: object
      required: [id, email, displayName, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { type: string }

    Household:
      type: object
      required: [id, name, currency, timezone, aiExtractionConsent, storage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, example: PKR }
        timezone: { type: string, example: Asia/Karachi }
        aiExtractionConsent:
          type: boolean
          description: Bill images may be sent to a third-party AI service to read them (docs/08 §5)
        storage: { $ref: '#/components/schemas/StorageUsage' }

    StorageUsage:
      type: object
      required: [usedBytes, quotaBytes, documentCount]
      properties:
        usedBytes: { type: integer, format: int64 }
        quotaBytes: { type: integer, format: int64 }
        documentCount: { type: integer }

    HouseholdInput:
      type: object
      required: [name, currency, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string }
        aiExtractionConsent: { type: boolean, description: Unchanged when omitted }

    Me:
      type: object
      required: [user, household, role]
      properties:
        user: { $ref: '#/components/schemas/User' }
        household: { $ref: '#/components/schemas/Household' }
        role: { $ref: '#/components/schemas/Role' }

    SignupRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 80 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }

    ProfileKind:
      type: string
      enum: [metered, recurring, expense_log]

    TypeGroup:
      type: string
      enum: [utilities, household, other]

    BillingCycle:
      type: string
      enum: [monthly, bimonthly, quarterly, yearly]

    BillType:
      type: object
      required: [id, name, icon, defaultKind, group, isSystem, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string, description: Lucide icon name }
        defaultKind: { $ref: '#/components/schemas/ProfileKind' }
        group: { $ref: '#/components/schemas/TypeGroup' }
        isSystem: { type: boolean }
        parentId: { type: string, format: uuid, nullable: true }
        archived: { type: boolean }

    BillTypeInput:
      type: object
      required: [name, icon, defaultKind, group]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        icon: { type: string, minLength: 1, maxLength: 40 }
        defaultKind: { $ref: '#/components/schemas/ProfileKind' }
        group: { $ref: '#/components/schemas/TypeGroup' }
        parentId: { type: string, format: uuid, nullable: true }

    Provider:
      type: object
      required: [id, name, shortName, typeId, refNumberLabel, isCustom]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shortName: { type: string }
        typeId: { type: string, format: uuid }
        region: { type: string, nullable: true }
        refNumberLabel: { type: string }
        refNumberPattern: { type: string, nullable: true }
        consumptionUnit: { type: string, nullable: true }
        isCustom: { type: boolean }

    ProviderInput:
      type: object
      required: [name, typeId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        shortName: { type: string, maxLength: 20 }
        typeId: { type: string, format: uuid }
        refNumberLabel: { type: string, maxLength: 40 }
        consumptionUnit: { type: string, maxLength: 12 }

    Profile:
      type: object
      required: [id, name, typeId, kind, icon, color, propertyId, autoCreateBill, isDefault, pinned, sortOrder, archived, summary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        typeId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ProfileKind' }
        icon: { type: string }
        color: { type: integer, minimum: 1, maximum: 8, description: Profile palette slot }
        propertyId: { type: string, format: uuid }
        providerId: { type: string, format: uuid, nullable: true }
        referenceNumber: { type: string, nullable: true }
        meterNumber: { type: string, nullable: true }
        multiplyingFactor: { type: number, format: double, nullable: true }
        consumptionUnit: { type: string, nullable: true }
        billingCycle: { allOf: [{ $ref: '#/components/schemas/BillingCycle' }], nullable: true }
        typicalIssueDay: { type: integer, nullable: true }
        typicalDueDay: { type: integer, nullable: true }
        expectedAmountMinor: { type: integer, format: int64, nullable: true }
        autoCreateBill: { type: boolean }
        isDefault: { type: boolean }
        pinned: { type: boolean }
        sortOrder: { type: integer }
        archived: { type: boolean }
        summary: { $ref: '#/components/schemas/ProfileSummary' }
        retrieval: { $ref: '#/components/schemas/ProfileRetrieval' }

    ProfileSummary:
      type: object
      required: [billCount, outstandingMinor, thisYearMinor]
      properties:
        billCount: { type: integer }
        outstandingMinor: { type: integer, format: int64 }
        thisYearMinor: { type: integer, format: int64, description: Spend this calendar year (current charges + adjustments) }
        latestBill: { $ref: '#/components/schemas/Bill' }
        lastReading: { type: number, format: double, nullable: true, description: The latest bill's present reading (next bill's previous reading) }

    ProfileInput:
      type: object
      required: [name, typeId]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        typeId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ProfileKind' }
        icon: { type: string, maxLength: 40 }
        color: { type: integer, minimum: 1, maximum: 8 }
        providerId: { type: string, format: uuid, nullable: true }
        referenceNumber: { type: string, maxLength: 40, nullable: true }
        meterNumber: { type: string, maxLength: 40, nullable: true }
        multiplyingFactor: { type: number, format: double, minimum: 0.0001, maximum: 100000, nullable: true }
        consumptionUnit: { type: string, maxLength: 12, nullable: true }
        billingCycle: { allOf: [{ $ref: '#/components/schemas/BillingCycle' }], nullable: true }
        typicalIssueDay: { type: integer, minimum: 1, maximum: 31, nullable: true }
        typicalDueDay: { type: integer, minimum: 1, maximum: 31, nullable: true }
        expectedAmountMinor: { type: integer, format: int64, minimum: 0, nullable: true }
        autoCreateBill: { type: boolean }
        pinned: { type: boolean }
        retrievalEnabled: { type: boolean, description: Check the official site automatically (only where a connector exists) }

    ProfileOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }

    BillStatus:
      type: string
      enum: [draft, unpaid, partially_paid, paid, overdue, cancelled]

    BillSource:
      type: string
      enum: [camera, upload, manual]

    SearchInterpretation:
      type: object
      required: [typeNames, providerNames, statuses, terms]
      properties:
        typeNames: { type: array, items: { type: string } }
        providerNames: { type: array, items: { type: string } }
        from: { type: string, nullable: true, example: '2025-09' }
        to: { type: string, nullable: true, example: '2025-09' }
        statuses: { type: array, items: { $ref: '#/components/schemas/BillStatus' } }
        terms: { type: array, items: { type: string }, description: Words searched as text }
        referenceMatch: { type: boolean, description: A word matched a profile's reference number }

    SearchProfile:
      type: object
      required: [id, name, icon, color, typeName]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        color: { type: integer }
        typeName: { type: string }
        providerName: { type: string, nullable: true }
        referenceDisplay: { type: string, nullable: true, description: Masked, e.g. "•••• 2345" }

    SearchDocument:
      type: object
      required: [id, fileName, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        kind: { type: string, enum: [bill, receipt, other] }
        billId: { type: string, format: uuid, nullable: true }
        snippet: { type: string, nullable: true, description: Text around the first match }
        createdAt: { type: string, format: date-time }

    SearchResult:
      type: object
      required: [query, interpretation, profiles, bills, documents]
      properties:
        query: { type: string }
        interpretation: { $ref: '#/components/schemas/SearchInterpretation' }
        profiles: { type: array, items: { $ref: '#/components/schemas/SearchProfile' } }
        bills: { type: array, items: { $ref: '#/components/schemas/Bill' } }
        documents: { type: array, items: { $ref: '#/components/schemas/SearchDocument' } }

    ActivityItem:
      type: object
      required: [id, at, action, profileId, profileName]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action: { type: string, enum: [bill_added, payment_added, payment_removed, document_added, profile_added] }
        actorName: { type: string, nullable: true }
        profileId: { type: string, format: uuid }
        profileName: { type: string }
        billId: { type: string, format: uuid, nullable: true }
        periodKey: { type: string, nullable: true }
        description: { type: string, nullable: true }
        amountMinor: { type: integer, format: int64, nullable: true }
        currency: { type: string, nullable: true }
        detail: { type: string, nullable: true, description: e.g. the file name or payment method }

    NotificationKind:
      type: string
      enum: [due_soon, due_today, overdue, missing_bill, bill_created, bill_retrieved]

    Notification:
      type: object
      required: [id, kind, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        profileId: { type: string, format: uuid, nullable: true }
        profileName: { type: string, nullable: true }
        profileIcon: { type: string, nullable: true }
        profileColor: { type: integer, nullable: true }
        billId: { type: string, format: uuid, nullable: true }
        periodKey: { type: string, nullable: true }
        description: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        amountMinor: { type: integer, format: int64, nullable: true }

    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unreadCount: { type: integer }

    NotificationSettings:
      type: object
      required: [leadDays, dueSoon, overdue, missing, push]
      properties:
        leadDays: { type: integer, minimum: 0, maximum: 14, description: Remind this many days before the due date }
        dueSoon: { type: boolean, description: Due soon and due today }
        overdue: { type: boolean }
        missing: { type: boolean, description: Expected bills not added yet }
        push: { type: boolean, description: Also send push notifications to devices that allowed them }
        quietStart: { type: integer, minimum: 0, maximum: 23, nullable: true, description: No push from this hour… }
        quietEnd: { type: integer, minimum: 0, maximum: 23, nullable: true, description: …until this hour (household time) }

    ExpectedBill:
      type: object
      required: [profileId, profileName, icon, color, periodKey]
      properties:
        profileId: { type: string, format: uuid }
        profileName: { type: string }
        icon: { type: string }
        color: { type: integer }
        periodKey: { type: string }

    PushKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }

    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2000 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 100 }

    PushTestResult:
      type: object
      required: [devices, delivered]
      properties:
        devices: { type: integer }
        delivered: { type: integer }

    ProfileRetrieval:
      type: object
      required: [mode, enabled]
      description: How this profile's bill can come from the official source (M6)
      properties:
        mode:
          type: string
          enum: [automatic, assisted, none]
          description: automatic = a connector fetches it; assisted = open the official lookup page yourself and upload the bill; none = no official source known
        lookupUrl: { type: string, nullable: true, description: The provider's official bill lookup page }
        enabled: { type: boolean, description: Automatic checks are on }
        connectorPaused: { type: boolean, description: The connector is switched off after repeated failures }
        lastAt: { type: string, format: date-time, nullable: true }
        lastOutcome: { type: string, nullable: true, enum: [created, merged, unchanged, not_found, failed, skipped] }
        lastMessage: { type: string, nullable: true }

    RetrievalResult:
      type: object
      required: [outcome, message]
      properties:
        outcome: { type: string, enum: [created, merged, unchanged, not_found, failed, skipped] }
        message: { type: string }
        billId: { type: string, format: uuid, nullable: true }

    ConnectorStatus:
      type: object
      required: [id, name, providers, healthy]
      properties:
        id: { type: string }
        name: { type: string }
        providers: { type: array, items: { type: string } }
        healthy: { type: boolean }
        disabledUntil: { type: string, format: date-time, nullable: true }
        consecutiveFailures: { type: integer }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }

    Bill:
      type: object
      required: [id, profileId, typeId, expenseDate, currentChargesMinor, arrearsMinor, adjustmentsMinor, payableMinor, currency, status, paidMinor, outstandingMinor, isEstimated, meterReplaced, cancelled, tags, archived, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        typeId: { type: string, format: uuid }
        description: { type: string, nullable: true }
        billNumber: { type: string, nullable: true }
        periodKey: { type: string, nullable: true, example: '2026-09' }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        expenseDate: { type: string, format: date }
        currentChargesMinor: { type: integer, format: int64 }
        arrearsMinor: { type: integer, format: int64 }
        adjustmentsMinor: { type: integer, format: int64 }
        payableMinor: { type: integer, format: int64 }
        payableAfterDueMinor: { type: integer, format: int64, nullable: true }
        lateStepUntil:
          type: string
          format: date
          nullable: true
          description: The after-due amount applies until this date; payableFinalMinor applies after it
        payableFinalMinor: { type: integer, format: int64, nullable: true }
        settledByBillId:
          type: string
          format: uuid
          nullable: true
          description: Paid through a later bill that carried this bill's amount as arrears
        currency: { type: string }
        status: { $ref: '#/components/schemas/BillStatus' }
        paidMinor: { type: integer, format: int64 }
        outstandingMinor: { type: integer, format: int64 }
        previousReading: { type: number, format: double, nullable: true }
        currentReading: { type: number, format: double, nullable: true }
        units: { type: number, format: double, nullable: true, description: Consumption for the period (readings × multiplying factor, or as printed) }
        multiplyingFactor: { type: number, format: double, nullable: true }
        meterReplaced: { type: boolean }
        isEstimated: { type: boolean }
        cancelled: { type: boolean }
        notes: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BillInput:
      type: object
      required: [profileId, currentChargesMinor]
      properties:
        profileId: { type: string, format: uuid }
        typeId: { type: string, format: uuid, nullable: true, description: Sub-category; defaults to the profile's type }
        description: { type: string, maxLength: 200, nullable: true }
        billNumber: { type: string, maxLength: 60, nullable: true }
        periodKey: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', nullable: true }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        expenseDate: { type: string, format: date, nullable: true }
        currentChargesMinor: { type: integer, format: int64, minimum: 0 }
        arrearsMinor: { type: integer, format: int64, minimum: 0 }
        adjustmentsMinor: { type: integer, format: int64 }
        payableMinor: { type: integer, format: int64, minimum: 0, nullable: true, description: Defaults to current charges + arrears + adjustments }
        payableAfterDueMinor: { type: integer, format: int64, minimum: 0, nullable: true }
        lateStepUntil: { type: string, format: date, nullable: true }
        payableFinalMinor: { type: integer, format: int64, minimum: 0, nullable: true }
        previousReading: { type: number, format: double, minimum: 0, nullable: true }
        currentReading: { type: number, format: double, minimum: 0, nullable: true }
        units: { type: number, format: double, nullable: true, description: Consumption for the period (readings × multiplying factor, or as printed) }
        multiplyingFactor: { type: number, format: double, minimum: 0.0001, nullable: true }
        meterReplaced: { type: boolean, description: The meter was replaced this period (readings restart) }
        isEstimated: { type: boolean }
        cancelled: { type: boolean }
        notes: { type: string, maxLength: 2000, nullable: true }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 30 }

    BillCreate:
      allOf:
        - $ref: '#/components/schemas/BillInput'
        - type: object
          properties:
            paidNow:
              $ref: '#/components/schemas/PaidNow'

    ScannedBillInput:
      type: object
      required: [bill]
      properties:
        bill: { $ref: '#/components/schemas/BillInput' }
        extractionId:
          type: string
          format: uuid
          description: The extraction the values came from, to record corrections
        history:
          type: array
          description: Bill history printed on the document, saved to the profile
          items: { $ref: '#/components/schemas/HistoryEntry' }
        duplicate:
          type: string
          enum: [attach, keep_separate]
          description: How to handle a duplicate reported by a previous attempt
        officialCopy:
          type: boolean
          description: The person saved this from the provider's official site (assisted retrieval); recorded as an official copy

    HistoryEntry:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        units: { type: number, format: double, nullable: true }
        billedMinor: { type: integer, format: int64, nullable: true }
        paidMinor: { type: integer, format: int64, nullable: true }

    ProfilePayment:
      type: object
      required: [id, billId, paidOn, amountMinor, method, createdAt, billExpenseDate]
      properties:
        id: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        paidOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        receiptDocumentId: { type: string, format: uuid, nullable: true }
        billPeriodKey: { type: string, nullable: true }
        billDescription: { type: string, nullable: true }
        billExpenseDate: { type: string, format: date }

    HistoryMonth:
      type: object
      required: [month, source]
      properties:
        status: { allOf: [{ $ref: '#/components/schemas/BillStatus' }], nullable: true, description: Status of the month's bill (bills only) }
        month: { type: string, example: '2026-08' }
        units: { type: number, format: double, nullable: true }
        billedMinor: { type: integer, format: int64, nullable: true, description: Spend for the month (excludes arrears for bills) }
        paidMinor: { type: integer, format: int64, nullable: true }
        source: { type: string, enum: [bill, printed] }
        billId: { type: string, format: uuid, nullable: true }

    PaidNow:
      type: object
      description: Records a full payment in the same step ("Already paid?")
      required: [paidOn, method]
      properties:
        paidOn: { type: string, format: date }
        method: { $ref: '#/components/schemas/PaymentMethod' }

    BillPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        nextCursor: { type: string, nullable: true }

    BillDetail:
      allOf:
        - $ref: '#/components/schemas/Bill'
        - type: object
          required: [payments, history, documents, sources, conflicts]
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            history:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/Document' }
            sources:
              type: array
              description: Every channel that produced or confirmed this bill, with its values (FR-RECO-06)
              items: { $ref: '#/components/schemas/BillOrigin' }
            conflicts:
              type: array
              description: Fields where sources disagree, open first (FR-RECO-04)
              items: { $ref: '#/components/schemas/BillConflict' }

    BillOriginKind:
      type: string
      enum: [manual, scan, upload, official, auto]

    BillOrigin:
      type: object
      required: [id, kind, values, filledFields, merged, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/BillOriginKind' }
        documentId: { type: string, format: uuid, nullable: true }
        documentName: { type: string, nullable: true }
        connector: { type: string, nullable: true }
        values:
          type: object
          additionalProperties: { type: string }
          description: Field → value as this source gave it (money in minor units, dates YYYY-MM-DD)
        filledFields: { type: array, items: { type: string }, description: Empty bill fields this source filled }
        merged: { type: boolean, description: Attached to an existing bill (can be separated within 30 days) }
        canSeparate: { type: boolean }
        createdByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    BillConflict:
      type: object
      required: [id, field, billValue, sourceValue, sourceId, sourceKind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        field: { type: string }
        billValue: { type: string, description: The bill's value when the conflict arose }
        sourceValue: { type: string }
        sourceId: { type: string, format: uuid }
        sourceKind: { $ref: '#/components/schemas/BillOriginKind' }
        status: { type: string, enum: [open, resolved] }
        resolution: { type: string, nullable: true, enum: [keep, source, manual, revised, confirmed] }
        resolvedValue: { type: string, nullable: true }
        resolvedByName: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ConflictResolution:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [keep, source, manual, revised]
          description: keep the bill's value, use the source's, enter one, or the provider revised the bill (use the source's, noted as a revision)
        value: { type: string, maxLength: 60, description: For action manual }

    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, card, jazzcash, easypaisa, cheque, other]

    Payment:
      type: object
      required: [id, billId, paidOn, amountMinor, method, createdAt]
      properties:
        id: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        paidOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        receiptDocumentId: { type: string, format: uuid, nullable: true }

    PaymentInput:
      type: object
      required: [paidOn, amountMinor, method]
      properties:
        paidOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string, maxLength: 80, nullable: true }
        notes: { type: string, maxLength: 500, nullable: true }
        receiptDocumentId:
          type: string
          format: uuid
          description: A document of this bill to keep as the payment's receipt

    DocumentKind:
      type: string
      enum: [bill, receipt, other]

    DocumentSource:
      type: string
      enum: [camera, upload]

    Document:
      type: object
      required: [id, kind, source, status, fileName, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        billId: { type: string, format: uuid, nullable: true }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        source: { $ref: '#/components/schemas/DocumentSource' }
        status: { type: string, enum: [pending, ready] }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        viewUrl: { type: string, nullable: true, description: Signed link for showing the file inline }
        downloadUrl: { type: string, nullable: true, description: Signed link that downloads the file }
        urlsExpireAt: { type: string, format: date-time, nullable: true }
        pageCount: { type: integer, nullable: true }
        paymentId: { type: string, format: uuid, nullable: true, description: Set when the document is a payment's receipt }

    ExtractedField:
      type: object
      required: [value, confidence, source]
      properties:
        value:
          type: string
          description: Money in minor units, dates YYYY-MM-DD, months YYYY-MM, numbers as decimals
        confidence: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, example: pdf-text+pitc }

    Extraction:
      type: object
      required: [id, documentId, status, tiers, fields, lineItems, lateFees, history, warnings, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        tiers:
          type: array
          items:
            type: object
            required: [tier, outcome, ms]
            properties:
              tier: { type: string, example: gemini }
              outcome: { type: string, enum: [used, skipped, failed, not_needed] }
              message: { type: string }
              ms: { type: integer, format: int64 }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ExtractedField' }
        lineItems:
          type: array
          items:
            type: object
            required: [label, amountMinor]
            properties:
              label: { type: string }
              amountMinor: { type: integer, format: int64 }
        lateFees:
          type: array
          items:
            type: object
            required: [amountMinor]
            properties:
              until: { type: string, format: date }
              amountMinor: { type: integer, format: int64 }
        history:
          type: array
          items:
            type: object
            required: [month]
            properties:
              month: { type: string, example: '2026-08' }
              units: { type: number }
              billedMinor: { type: integer, format: int64 }
              paidMinor: { type: integer, format: int64 }
        warnings:
          type: array
          items:
            type: object
            required: [message]
            properties:
              field: { type: string }
              message: { type: string }
        providerId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    DocumentUploadInput:
      type: object
      required: [fileName, contentType, sizeBytes, sha256, kind, source]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 200 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        source: { $ref: '#/components/schemas/DocumentSource' }
        billId: { type: string, format: uuid }

    DocumentUpload:
      type: object
      required: [document, duplicate]
      properties:
        document: { $ref: '#/components/schemas/Document' }
        duplicate: { type: boolean }
        upload:
          type: object
          nullable: true
          required: [url, method, headers]
          properties:
            url: { type: string }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }

    DocumentUpdate:
      type: object
      required: [kind]
      properties:
        billId: { type: string, format: uuid, nullable: true }
        kind: { $ref: '#/components/schemas/DocumentKind' }

    AuditEvent:
      type: object
      required: [id, at, action, entityType, changes]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorName: { type: string, nullable: true }
        entityType: { type: string }
        action: { type: string }
        changes:
          type: object
          additionalProperties: true

    MonthTotalGroup:
      type: object
      required: [group, totalMinor, paidMinor, remainingMinor, billCount]
      properties:
        group: { $ref: '#/components/schemas/TypeGroup' }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        remainingMinor: { type: integer, format: int64 }
        billCount: { type: integer }

    MonthTotalProfile:
      type: object
      required: [profileId, name, icon, color, group, totalMinor, paidMinor, remainingMinor, billCount]
      properties:
        profileId: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        color: { type: integer }
        group: { $ref: '#/components/schemas/TypeGroup' }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        remainingMinor: { type: integer, format: int64 }
        billCount: { type: integer }

    MonthTotal:
      type: object
      description: FR-DASH-07 — what the household has to pay for the month's bills.
      required: [totalMinor, paidMinor, remainingMinor, billCount, earlierOutstandingMinor, groups, profiles]
      properties:
        totalMinor: { type: integer, format: int64, description: paid + remaining }
        paidMinor: { type: integer, format: int64 }
        remainingMinor: { type: integer, format: int64, description: Still to pay at today's amounts (late fees included once due) }
        billCount: { type: integer }
        earlierOutstandingMinor:
          type: integer
          format: int64
          description: Still owed on earlier months' bills, not counting amounts this month's open bills already carry as arrears
        groups:
          type: array
          items: { $ref: '#/components/schemas/MonthTotalGroup' }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/MonthTotalProfile' }
        nextDue:
          allOf:
            - $ref: '#/components/schemas/Bill'
          nullable: true

    AnalyticsSeries:
      type: object
      description: One line of a breakdown (the whole household, a group, a type, a provider or a profile).
      required: [key, name, totalMinor, previousMinor, lastYearMinor, months, billCount]
      properties:
        key: { type: string, description: 'Group name, type id, provider id ("none" for no provider) or profile id' }
        name: { type: string }
        icon: { type: string, nullable: true }
        color: { type: integer, nullable: true }
        group: { allOf: [{ $ref: '#/components/schemas/TypeGroup' }], nullable: true }
        kind: { allOf: [{ $ref: '#/components/schemas/ProfileKind' }], nullable: true }
        unit: { type: string, nullable: true, description: Consumption unit (profiles) }
        totalMinor: { type: integer, format: int64 }
        previousMinor: { type: integer, format: int64, description: Same-length period just before }
        lastYearMinor: { type: integer, format: int64, description: Same months a year earlier }
        months:
          type: array
          description: One amount per month of the range, in order
          items: { type: integer, format: int64 }
        billCount: { type: integer }
        avgMinor: { type: integer, format: int64, nullable: true, description: Average bill (profiles, spend basis) }
        maxMinor: { type: integer, format: int64, nullable: true }
        minMinor: { type: integer, format: int64, nullable: true }
        maxBillId: { type: string, format: uuid, nullable: true }
        unitsTotal: { type: number, format: double, nullable: true }
        unitsPrevious: { type: number, format: double, nullable: true }
        unitsLastYear: { type: number, format: double, nullable: true }
        unitsMonths:
          type: array
          nullable: true
          items: { type: number, format: double, nullable: true }

    Analytics:
      type: object
      required: [from, to, basis, months, total, groups, types, providers, profiles]
      properties:
        from: { type: string }
        to: { type: string }
        basis: { type: string, enum: [spend, cash] }
        months: { type: array, items: { type: string } }
        total: { $ref: '#/components/schemas/AnalyticsSeries' }
        groups: { type: array, items: { $ref: '#/components/schemas/AnalyticsSeries' } }
        types: { type: array, items: { $ref: '#/components/schemas/AnalyticsSeries' } }
        providers: { type: array, items: { $ref: '#/components/schemas/AnalyticsSeries' } }
        profiles: { type: array, items: { $ref: '#/components/schemas/AnalyticsSeries' } }

    HomeSummary:
      type: object
      required: [month, billedMinor, paidMinor, outstandingMinor, dueSoon, overdue, pinned, recent, monthTotal, expectedMissing, reviewCount]
      properties:
        monthTotal: { $ref: '#/components/schemas/MonthTotal' }
        month: { type: string, example: '2026-10' }
        billedMinor: { type: integer, format: int64, description: Spend for the month (current charges + adjustments) }
        paidMinor: { type: integer, format: int64, description: Payments made during the month }
        outstandingMinor: { type: integer, format: int64, description: Unpaid amount across all open bills }
        dueSoon:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        pinned:
          type: array
          items: { $ref: '#/components/schemas/Profile' }
        recent:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        expectedMissing:
          type: array
          description: Bills expected by now but not added yet (FR-DASH-04, FR-REM-04)
          items: { $ref: '#/components/schemas/ExpectedBill' }
        reviewCount: { type: integer, description: Bills whose sources disagree and need a decision (docs/06 §4) }
