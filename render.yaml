# Render Blueprint — the Go API on the free web service (docs/adr/005-hosting.md).
# In Render: New → Blueprint → pick this repository. Fill the `sync: false` values when asked.
services:
  - type: web
    name: bill-management-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase *session pooler* URL (IPv4), see docs/deploy.md
      - key: APP_BASE_URL
        sync: false # e.g. https://bill-management.pages.dev
      - key: TICK_TOKEN
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true # copy it to your password manager: without it, encrypted data can't be read
      - key: S3_ENDPOINT
        sync: false # https://<project>.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false # the Supabase project's region, e.g. ap-southeast-1
      - key: S3_BUCKET
        value: documents
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false # optional until email is set up
      - key: MAIL_FROM
        value: Bill Manager <onboarding@resend.dev>
